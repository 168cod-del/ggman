<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>餐廳後台管理</title>
<style>
  :root{
    --bg: #1b1f1d;
    --panel: #242a27;
    --text: #f2ede1;
    --dim: #9aa39c;
    --accent: #e8a33d;
    --danger: #c0392b;
    --line: #333c37;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; padding: 24px 16px 80px;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Noto Sans TC", sans-serif;
  }
  h1{ font-size: 20px; margin: 0 0 4px; }
  h2{ font-size: 15px; margin: 0 0 10px; color: var(--accent); }
  p.hint{ font-size: 12.5px; color: var(--dim); margin: 0 0 16px; }

  .panel{
    background: var(--panel); border-radius: 14px; padding: 16px;
    margin-bottom: 16px; border: 1px solid var(--line);
  }

  input[type="text"]{
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #141817; color: var(--text);
    font-size: 14px; margin-bottom: 8px;
  }
  button{
    border: none; border-radius: 8px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .btn-primary{ background: var(--accent); color: #2b1d05; }
  .btn-danger{ background: var(--danger); color: #fff; }
  .btn-secondary{ background: var(--line); color: var(--text); }

  .row{ display:flex; gap: 8px; }
  .row input{ flex:1; margin-bottom:0; }

  table{ width:100%; border-collapse: collapse; margin-top: 6px; }
  th, td{ padding: 8px 4px; text-align:left; font-size: 13px; }
  th{ color: var(--dim); font-weight: 500; border-bottom: 1px solid var(--line); }
  td{ border-bottom: 1px solid var(--line); }
  .status-yes{ color: #7cb87c; }
  .status-no{ color: var(--dim); }

  #password-gate{
    position: fixed; inset:0; background: var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 12px; z-index: 100; padding: 24px;
  }
  #password-gate input{ max-width: 260px; }
  .msg{ font-size: 13px; margin-top: 8px; }
  .msg.error{ color: var(--danger); }
  .msg.success{ color: #7cb87c; }
</style>
</head>
<body>

<div id="password-gate">
  <h1>🔑 餐廳後台</h1>
  <input type="text" id="password-input" placeholder="請輸入後台密碼" />
  <button class="btn-primary" onclick="checkPassword()">進入</button>
  <div class="msg error" id="password-msg"></div>
</div>

<div id="main-content" style="display:none;">
  <h1>🍽️ 餐廳後台管理</h1>
  <p class="hint">
    新增餐廳後，可以直接在下方清單按「📷 上傳照片」選擇圖片（電腦、手機都可以）；
    也可以在 Telegram 打「/新增菜單 餐廳名稱」，接著上傳一張菜單照片。
    資料存在伺服器記憶體中，重新部署會重置。
  </p>

  <div class="panel">
    <h2>新增餐廳</h2>
    <div class="row">
      <input type="text" id="new-restaurant-name" placeholder="餐廳名稱" />
      <button class="btn-primary" onclick="addRestaurant()">新增</button>
    </div>
    <div class="msg" id="add-restaurant-msg"></div>
  </div>

  <div class="panel">
    <h2>目前的餐廳清單</h2>
    <table>
      <thead><tr><th>餐廳名稱</th><th>菜單照片</th><th></th><th></th></tr></thead>
      <tbody id="restaurant-tbody"></tbody>
    </table>
  </div>
</div>

<script>
  let ADMIN_PASSWORD = "";

  function checkPassword(){
    ADMIN_PASSWORD = document.getElementById("password-input").value;
    document.getElementById("password-gate").style.display = "none";
    document.getElementById("main-content").style.display = "block";
    loadRestaurants();
  }

  async function apiGetAdmin(path){
    const res = await fetch(path, { headers: { "X-Admin-Password": ADMIN_PASSWORD } });
    const data = await res.json();
    if(res.status === 401){
      document.getElementById("password-gate").style.display = "flex";
      document.getElementById("main-content").style.display = "none";
      document.getElementById("password-msg").textContent = "密碼錯誤，請重新輸入";
      throw new Error("密碼錯誤");
    }
    if(!res.ok) throw new Error(data.detail || "request failed");
    return data;
  }

  async function apiPostAdmin(path, body){
    const res = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Password": ADMIN_PASSWORD },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if(res.status === 401){
      document.getElementById("password-gate").style.display = "flex";
      document.getElementById("main-content").style.display = "none";
      document.getElementById("password-msg").textContent = "密碼錯誤，請重新輸入";
      throw new Error("密碼錯誤");
    }
    if(!res.ok) throw new Error(data.detail || "request failed");
    return data;
  }

  async function loadRestaurants(){
    try{
      const data = await apiGetAdmin("/api/admin/restaurants");
      renderTable(data.restaurants);
    } catch(e){ console.error(e); }
  }

  function renderTable(restaurants){
    const tbody = document.getElementById("restaurant-tbody");
    if(restaurants.length === 0){
      tbody.innerHTML = `<tr><td colspan="4">目前還沒有任何餐廳</td></tr>`;
      return;
    }
    tbody.innerHTML = restaurants.map((r, idx) => `
      <tr>
        <td>${r.name}</td>
        <td class="${r.has_photo ? 'status-yes' : 'status-no'}">${r.has_photo ? '✅ 已上傳' : '— 尚未上傳'}</td>
        <td>
          <button class="btn-secondary" onclick="triggerUpload(${idx})">📷 上傳照片</button>
          <input type="file" accept="image/*" style="display:none;" id="photo-input-${idx}"
                 onchange="onPhotoChosen(${idx}, '${r.name.replace(/'/g, "\\'")}')" />
        </td>
        <td><button class="btn-danger" onclick="deleteRestaurant('${r.name.replace(/'/g, "\\'")}')">刪除</button></td>
      </tr>
    `).join("");
  }

  function triggerUpload(idx){
    document.getElementById(`photo-input-${idx}`).click();
  }

  function fileToBase64(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function onPhotoChosen(idx, name){
    const input = document.getElementById(`photo-input-${idx}`);
    const file = input.files[0];
    if(!file) return;
    try{
      const base64 = await fileToBase64(file);
      await apiPostAdmin(`/api/admin/restaurants/${encodeURIComponent(name)}/photo`, { image_base64: base64 });
      await loadRestaurants();
    } catch(e){
      alert(e.message);
    } finally {
      input.value = "";
    }
  }

  async function addRestaurant(){
    const nameInput = document.getElementById("new-restaurant-name");
    const name = nameInput.value.trim();
    const msgEl = document.getElementById("add-restaurant-msg");
    if(!name){
      msgEl.textContent = "請輸入餐廳名稱";
      msgEl.className = "msg error";
      return;
    }
    try{
      await apiPostAdmin("/api/admin/restaurants", { name });
      msgEl.textContent = `已新增「${name}」，可以在下方清單上傳菜單照片`;
      msgEl.className = "msg success";
      nameInput.value = "";
      await loadRestaurants();
    } catch(e){
      msgEl.textContent = e.message;
      msgEl.className = "msg error";
    }
  }

  async function deleteRestaurant(name){
    if(!confirm(`確定要刪除「${name}」嗎？`)) return;
    try{
      await apiPostAdmin("/api/admin/restaurants/delete", { name });
      await loadRestaurants();
    } catch(e){
      alert(e.message);
    }
  }
</script>

</body>
</html>

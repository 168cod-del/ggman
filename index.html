<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>點餐</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board-bg: #1f2b22;
    --board-bg-light: #26352b;
    --chalk: #f2ede1;
    --chalk-dim: #b9c2ba;
    --amber: #e8a33d;
    --lantern-red: #c0392b;
    --lantern-red-dark: #9c2d20;
    --line: rgba(242,237,225,0.14);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0;
    background: var(--board-bg);
    color: var(--chalk);
    font-family: 'Noto Sans TC', sans-serif;
    min-height:100vh;
  }
  body::before{
    content:"";
    position: fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.025), transparent 40%);
    pointer-events:none;
  }

  header{
    padding: 20px 18px 14px;
    position: sticky; top:0; z-index: 5;
    background: linear-gradient(180deg, var(--board-bg) 70%, transparent);
  }
  header h1{
    font-family: 'Kalam', cursive;
    font-size: 30px;
    margin: 0 0 2px;
    color: var(--chalk);
    letter-spacing: 0.5px;
  }
  header p{
    margin: 0;
    font-size: 12.5px;
    color: var(--chalk-dim);
  }

  .tabs{
    display:flex; gap: 8px;
    padding: 10px 18px 4px;
    overflow-x:auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 0 0 auto;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 13px;
    color: var(--chalk-dim);
    background: transparent;
    white-space: nowrap;
  }
  .tab.active{
    background: var(--amber);
    color: #2b1d05;
    border-color: var(--amber);
    font-weight: 700;
  }

  main{ padding: 6px 18px 140px; }

  .category-title{
    font-family:'Kalam', cursive;
    font-size: 20px;
    color: var(--amber);
    margin: 22px 2px 10px;
    display:flex; align-items:center; gap:8px;
  }
  .category-title::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .item{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px dashed var(--line);
  }
  .item-info{ flex:1; min-width:0; }
  .item-name{
    font-size: 15.5px;
    font-weight: 500;
    color: var(--chalk);
  }
  .item-desc{
    font-size: 12px;
    color: var(--chalk-dim);
    margin-top: 2px;
  }
  .item-price{
    font-family:'Kalam', cursive;
    font-size: 16px;
    color: var(--amber);
    margin-top: 4px;
  }

  .qty-control{
    display:flex; align-items:center; gap: 10px;
    flex: 0 0 auto;
  }
  .qty-btn{
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--board-bg-light);
    color: var(--chalk);
    font-size: 17px;
    line-height: 1;
    display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .qty-btn:active{ background: var(--amber); color:#2b1d05; border-color: var(--amber); }
  .qty-btn.disabled{ opacity: 0.3; pointer-events:none; }
  .qty-num{
    min-width: 18px;
    text-align:center;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  .cart-bar{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--board-bg) 65%, rgba(31,43,34,0));
    z-index: 10;
  }
  .cart-summary{
    display:flex; justify-content:space-between; align-items:baseline;
    padding: 0 4px 8px;
  }
  .cart-summary .label{ font-size: 12.5px; color: var(--chalk-dim); }
  .cart-summary .total{
    font-family:'Kalam', cursive;
    font-size: 22px;
    color: var(--amber);
  }
  /* 這顆按鈕只在「不在 Telegram App 內」(例如用電腦瀏覽器測試) 時才會顯示，
     在 Telegram 內一律使用原生 MainButton 送出訂單，避免兩顆按鈕疊在一起在手機上點不到 */
  .confirm-btn{
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px;
    background: var(--lantern-red);
    color: #fff2ea;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 1px;
    box-shadow: 0 6px 18px rgba(192,57,43,0.35);
  }
  .confirm-btn:active{ background: var(--lantern-red-dark); }
  .confirm-btn.disabled{
    background: var(--board-bg-light);
    color: var(--chalk-dim);
    box-shadow:none;
  }
  .confirm-btn.hidden{ display:none; }

  .empty-hint{
    text-align:center;
    color: var(--chalk-dim);
    font-size: 12px;
    padding: 4px 0 0;
  }
</style>
</head>
<body>

<header>
  <h1>今日菜單 🏮</h1>
  <p>選好想吃的，數量按一按，最後按「確認點餐」送出</p>
</header>

<div class="tabs" id="tabs"></div>

<main id="menu"></main>

<div class="cart-bar">
  <div class="cart-summary">
    <span class="label" id="cart-count">尚未選購任何餐點</span>
    <span class="total">NT$ <span id="cart-total">0</span></span>
  </div>
  <button class="confirm-btn disabled" id="confirm-btn">確認點餐</button>
  <div class="empty-hint" id="empty-hint">請先選擇至少一項餐點</div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  // ---------------------------------------------------------
  // 菜單資料（示範資料，可自行替換成真實菜單 / API 撈取）
  // ---------------------------------------------------------
  const MENU = [
    {
      category: "主食",
      items: [
        { id: "m1", name: "招牌滷肉飯", desc: "選用黑豬肉，滷汁濃郁", price: 60 },
        { id: "m2", name: "雞腿便當", desc: "現炸雞腿排 + 三樣配菜", price: 120 },
        { id: "m3", name: "牛肉麵", desc: "紅燒牛腱，麵條Q彈", price: 150 },
      ],
    },
    {
      category: "小菜",
      items: [
        { id: "s1", name: "涼拌小黃瓜", desc: "", price: 40 },
        { id: "s2", name: "滷豆干", desc: "", price: 30 },
        { id: "s3", name: "青菜豆腐", desc: "時令蔬菜", price: 50 },
      ],
    },
    {
      category: "湯品",
      items: [
        { id: "d1", name: "貢丸湯", desc: "", price: 35 },
        { id: "d2", name: "味噌湯", desc: "", price: 30 },
      ],
    },
    {
      category: "飲料",
      items: [
        { id: "b1", name: "古早味紅茶", desc: "冰/熱皆可", price: 25 },
        { id: "b2", name: "冬瓜檸檬", desc: "", price: 35 },
      ],
    },
  ];

  const cart = {}; // { itemId: qty }

  function findItem(id){
    for(const cat of MENU){
      const found = cat.items.find(i => i.id === id);
      if(found) return found;
    }
    return null;
  }

  function renderTabs(){
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = MENU.map((cat, idx) =>
      `<button class="tab ${idx===0 ? 'active':''}" data-target="cat-${idx}">${cat.category}</button>`
    ).join("");

    tabsEl.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        tabsEl.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.target)?.scrollIntoView({ behavior:"smooth", block:"start" });
      });
    });
  }

  function renderMenu(){
    const menuEl = document.getElementById("menu");
    menuEl.innerHTML = MENU.map((cat, idx) => `
      <div id="cat-${idx}">
        <div class="category-title">${cat.category}</div>
        ${cat.items.map(item => `
          <div class="item">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ""}
              <div class="item-price">NT$ ${item.price}</div>
            </div>
            <div class="qty-control">
              <button class="qty-btn minus" data-id="${item.id}">−</button>
              <span class="qty-num" id="qty-${item.id}">0</span>
              <button class="qty-btn plus" data-id="${item.id}">＋</button>
            </div>
          </div>
        `).join("")}
      </div>
    `).join("");

    menuEl.querySelectorAll(".qty-btn.plus").forEach(btn => {
      btn.addEventListener("click", () => changeQty(btn.dataset.id, 1));
    });
    menuEl.querySelectorAll(".qty-btn.minus").forEach(btn => {
      btn.addEventListener("click", () => changeQty(btn.dataset.id, -1));
    });
  }

  function changeQty(id, delta){
    const current = cart[id] || 0;
    const next = Math.max(0, current + delta);
    if(next === 0){
      delete cart[id];
    } else {
      cart[id] = next;
    }
    document.getElementById(`qty-${id}`).textContent = next;
    updateCartBar();
    tg?.HapticFeedback?.impactOccurred("light");
  }

  // 是否真的在 Telegram App 內開啟（不是用一般電腦瀏覽器直接打開網址測試）
  const isInTelegram = !!(tg && tg.initData && tg.initData.length > 0);

  function updateCartBar(){
    const ids = Object.keys(cart);
    const totalQty = ids.reduce((sum, id) => sum + cart[id], 0);
    const totalPrice = ids.reduce((sum, id) => sum + cart[id] * findItem(id).price, 0);

    document.getElementById("cart-total").textContent = totalPrice;
    document.getElementById("cart-count").textContent =
      totalQty > 0 ? `已選 ${totalQty} 件` : "尚未選購任何餐點";

    const confirmBtn = document.getElementById("confirm-btn");
    const emptyHint = document.getElementById("empty-hint");

    if(isInTelegram){
      // 在 Telegram 內：一律用原生 MainButton 送出，網頁上的按鈕永遠隱藏，
      // 避免手機上原生按鈕跟網頁按鈕疊在同一個位置造成點不到的問題
      confirmBtn.classList.add("hidden");
      emptyHint.style.display = "none";

      if(totalQty > 0){
        tg.MainButton.setText(`確認點餐 · NT$${totalPrice}`);
        tg.MainButton.show();
        tg.MainButton.enable();
      } else {
        tg.MainButton.hide();
      }
    } else {
      // 不在 Telegram 內（例如用電腦瀏覽器直接打開網址測試）：顯示網頁按鈕
      confirmBtn.classList.remove("hidden");
      if(totalQty > 0){
        confirmBtn.classList.remove("disabled");
        emptyHint.style.display = "none";
      } else {
        confirmBtn.classList.add("disabled");
        emptyHint.style.display = "block";
      }
    }
  }

  function submitOrder(){
    const ids = Object.keys(cart);
    if(ids.length === 0) return;

    const order = {
      items: ids.map(id => {
        const item = findItem(id);
        return { id: item.id, name: item.name, price: item.price, qty: cart[id] };
      }),
      total: ids.reduce((sum, id) => sum + cart[id] * findItem(id).price, 0),
    };

    if(tg && tg.sendData){
      tg.sendData(JSON.stringify(order));
    } else {
      // 不在 Telegram 環境內時（例如瀏覽器測試），僅印出結果方便除錯
      alert("訂單資料：\n" + JSON.stringify(order, null, 2));
    }
  }

  document.getElementById("confirm-btn").addEventListener("click", submitOrder);
  if(isInTelegram){
    tg.MainButton.onClick(submitOrder);
  }

  renderTabs();
  renderMenu();
  updateCartBar();
</script>

</body>
</html>

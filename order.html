<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>點餐</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board-bg: #1f2b22;
    --board-bg-light: #26352b;
    --chalk: #f2ede1;
    --chalk-dim: #b9c2ba;
    --amber: #e8a33d;
    --lantern-red: #c0392b;
    --lantern-red-dark: #9c2d20;
    --line: rgba(242,237,225,0.14);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0;
    background: var(--board-bg);
    color: var(--chalk);
    font-family: 'Noto Sans TC', sans-serif;
    min-height:100vh;
  }
  header{
    padding: 20px 18px 14px;
    position: sticky; top:0; z-index: 5;
    background: linear-gradient(180deg, var(--board-bg) 70%, transparent);
  }
  header h1{
    font-family: 'Kalam', cursive;
    font-size: 26px;
    margin: 0 0 2px;
  }
  header p{ margin: 0; font-size: 12.5px; color: var(--chalk-dim); }

  .tabs{ display:flex; gap: 8px; padding: 10px 18px 4px; overflow-x:auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 0 0 auto; padding: 7px 16px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 13px; color: var(--chalk-dim); background: transparent; white-space: nowrap;
  }
  .tab.active{ background: var(--amber); color: #2b1d05; border-color: var(--amber); font-weight: 700; }

  main{ padding: 6px 18px 140px; }

  .category-title{
    font-family:'Kalam', cursive; font-size: 20px; color: var(--amber);
    margin: 22px 2px 10px; display:flex; align-items:center; gap:8px;
  }
  .category-title::after{ content:""; flex:1; height:1px; background: var(--line); }

  .item{ display:flex; align-items:center; gap: 12px; padding: 14px 4px; border-bottom: 1px dashed var(--line); }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size: 15.5px; font-weight: 500; }
  .item-price{ font-family:'Kalam', cursive; font-size: 16px; color: var(--amber); margin-top: 4px; }

  .qty-control{ display:flex; align-items:center; gap: 10px; flex: 0 0 auto; }
  .qty-btn{
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--board-bg-light); color: var(--chalk); font-size: 17px; line-height: 1;
    display:flex; align-items:center; justify-content:center; user-select:none;
  }
  .qty-btn:active{ background: var(--amber); color:#2b1d05; border-color: var(--amber); }
  .qty-num{ min-width: 18px; text-align:center; font-size: 15px; font-variant-numeric: tabular-nums; }

  .cart-bar{
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--board-bg) 65%, rgba(31,43,34,0));
    z-index: 10;
  }
  .cart-summary{ display:flex; justify-content:space-between; align-items:baseline; padding: 0 4px 8px; }
  .cart-summary .label{ font-size: 12.5px; color: var(--chalk-dim); }
  .cart-summary .total{ font-family:'Kalam', cursive; font-size: 22px; color: var(--amber); }

  .confirm-btn{
    width: 100%; border: none; border-radius: 14px; padding: 15px;
    background: var(--lantern-red); color: #fff2ea; font-size: 16px; font-weight: 700;
    letter-spacing: 1px; box-shadow: 0 6px 18px rgba(192,57,43,0.35);
  }
  .confirm-btn:active{ background: var(--lantern-red-dark); }
  .confirm-btn.disabled{ background: var(--board-bg-light); color: var(--chalk-dim); box-shadow:none; }
  .confirm-btn.hidden{ display:none; }
  .empty-hint{ text-align:center; color: var(--chalk-dim); font-size: 12px; padding: 4px 0 0; }

  .status-screen{
    min-height: 80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 0 24px; gap: 10px;
  }
  .status-screen .icon{ font-size: 40px; }
  .status-screen p{ color: var(--chalk-dim); font-size: 14px; margin:0; }
  .spinner{
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--amber);
    animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="app">
  <div class="status-screen">
    <div class="spinner"></div>
    <p>正在載入點餐資訊…</p>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const chatId = params.get("chat_id");

  const app = document.getElementById("app");
  const isInTelegram = !!(tg && tg.platform && tg.platform !== "unknown");

  const cart = {};
  let MENU_ITEMS = []; // 該餐廳的原始品項陣列

  function showStatus(icon, text){
    app.innerHTML = `
      <div class="status-screen">
        <div class="icon">${icon}</div>
        <p>${text}</p>
      </div>`;
  }

  async function fetchSession(){
    const res = await fetch(`/api/session/${chatId}`);
    return res.json();
  }

  async function fetchMenu(restaurant){
    const res = await fetch(`/api/menu/${encodeURIComponent(restaurant)}`);
    if(!res.ok) throw new Error("menu fetch failed");
    return res.json();
  }

  function groupByCategory(items){
    const map = new Map();
    items.forEach((item, idx) => {
      const cat = item.category || "未分類";
      if(!map.has(cat)) map.set(cat, []);
      map.get(cat).push({ ...item, id: `item-${idx}` });
    });
    return Array.from(map.entries()).map(([category, items]) => ({ category, items }));
  }

  function findItem(id){
    return MENU_ITEMS.find(i => i.id === id);
  }

  function renderOrderingUI(restaurant, groupedMenu){
    app.innerHTML = `
      <header>
        <h1>${restaurant} 🏮</h1>
        <p>選好想吃的，數量按一按，最後按下方按鈕送出</p>
      </header>
      <div class="tabs" id="tabs"></div>
      <main id="menu"></main>
      <div class="cart-bar">
        <div class="cart-summary">
          <span class="label" id="cart-count">尚未選購任何餐點</span>
          <span class="total">NT$ <span id="cart-total">0</span></span>
        </div>
        <button class="confirm-btn disabled" id="confirm-btn">確認點餐</button>
        <div class="empty-hint" id="empty-hint">請先選擇至少一項餐點</div>
      </div>
    `;

    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML = groupedMenu.map((cat, idx) =>
      `<button class="tab ${idx===0 ? 'active':''}" data-target="cat-${idx}">${cat.category}</button>`
    ).join("");
    tabsEl.querySelectorAll(".tab").forEach(btn => {
      btn.addEventListener("click", () => {
        tabsEl.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.target)?.scrollIntoView({ behavior:"smooth", block:"start" });
      });
    });

    const menuEl = document.getElementById("menu");
    menuEl.innerHTML = groupedMenu.map((cat, idx) => `
      <div id="cat-${idx}">
        <div class="category-title">${cat.category}</div>
        ${cat.items.map(item => `
          <div class="item">
            <div class="item-info">
              <div class="item-name">${item.name}</div>
              <div class="item-price">NT$ ${item.price}</div>
            </div>
            <div class="qty-control">
              <button class="qty-btn minus" data-id="${item.id}">−</button>
              <span class="qty-num" id="qty-${item.id}">0</span>
              <button class="qty-btn plus" data-id="${item.id}">＋</button>
            </div>
          </div>
        `).join("")}
      </div>
    `).join("");

    menuEl.querySelectorAll(".qty-btn.plus").forEach(btn => btn.addEventListener("click", () => changeQty(btn.dataset.id, 1)));
    menuEl.querySelectorAll(".qty-btn.minus").forEach(btn => btn.addEventListener("click", () => changeQty(btn.dataset.id, -1)));

    document.getElementById("confirm-btn").addEventListener("click", submitOrder);
    if(isInTelegram){
      tg.MainButton.onClick(submitOrder);
    }

    updateCartBar();
  }

  function changeQty(id, delta){
    const current = cart[id] || 0;
    const next = Math.max(0, current + delta);
    if(next === 0) delete cart[id]; else cart[id] = next;
    document.getElementById(`qty-${id}`).textContent = next;
    updateCartBar();
    tg?.HapticFeedback?.impactOccurred("light");
  }

  function updateCartBar(){
    const ids = Object.keys(cart);
    const totalQty = ids.reduce((sum, id) => sum + cart[id], 0);
    const totalPrice = ids.reduce((sum, id) => sum + cart[id] * findItem(id).price, 0);

    const cartTotalEl = document.getElementById("cart-total");
    const cartCountEl = document.getElementById("cart-count");
    if(!cartTotalEl) return;

    cartTotalEl.textContent = totalPrice;
    cartCountEl.textContent = totalQty > 0 ? `已選 ${totalQty} 件` : "尚未選購任何餐點";

    const confirmBtn = document.getElementById("confirm-btn");
    const emptyHint = document.getElementById("empty-hint");

    if(isInTelegram){
      confirmBtn.classList.add("hidden");
      emptyHint.style.display = "none";
      if(totalQty > 0){
        tg.MainButton.setText(`確認點餐 · NT$${totalPrice}`);
        tg.MainButton.show();
        tg.MainButton.enable();
      } else {
        tg.MainButton.hide();
      }
    } else {
      confirmBtn.classList.remove("hidden");
      if(totalQty > 0){
        confirmBtn.classList.remove("disabled");
        emptyHint.style.display = "none";
      } else {
        confirmBtn.classList.add("disabled");
        emptyHint.style.display = "block";
      }
    }
  }

  function submitOrder(){
    const ids = Object.keys(cart);
    if(ids.length === 0) return;

    const order = {
      items: ids.map(id => {
        const item = findItem(id);
        return { name: item.name, price: item.price, qty: cart[id] };
      }),
      total: ids.reduce((sum, id) => sum + cart[id] * findItem(id).price, 0),
    };

    if(tg && tg.sendData){
      tg.sendData(JSON.stringify(order));
    } else {
      alert("訂單資料：\n" + JSON.stringify(order, null, 2));
    }
  }

  // ---------------------------------------------------------
  // 主流程：確認場次是否存在、餐廳是否已選好，再載入菜單
  // ---------------------------------------------------------
  async function init(){
    if(!chatId){
      showStatus("⚠️", "網址缺少聊天室資訊，請從 Telegram 內的按鈕開啟。");
      return;
    }

    let session;
    try{
      session = await fetchSession();
    } catch(e){
      showStatus("⚠️", "無法連線到伺服器，請稍後再試。");
      return;
    }

    if(!session.active){
      showStatus("🔒", "目前沒有進行中的點餐，請先請一位成員輸入 /start 發起。");
      return;
    }

    if(!session.restaurant){
      showStatus("⏳", "發起人還在選擇餐廳，請稍候…");
      setTimeout(init, 2500); // 每 2.5 秒檢查一次
      return;
    }

    let menuData;
    try{
      menuData = await fetchMenu(session.restaurant);
    } catch(e){
      showStatus("⚠️", "菜單載入失敗，請稍後再試。");
      return;
    }

    MENU_ITEMS = menuData.items.map((item, idx) => ({ ...item, id: `item-${idx}` }));
    const grouped = groupByCategory(menuData.items);
    renderOrderingUI(menuData.restaurant, grouped);
  }

  init();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>選擇餐廳</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board-bg: #1f2b22;
    --board-bg-light: #26352b;
    --chalk: #f2ede1;
    --chalk-dim: #b9c2ba;
    --amber: #e8a33d;
    --line: rgba(242,237,225,0.14);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--board-bg); color: var(--chalk);
    font-family: 'Noto Sans TC', sans-serif;
  }
  header{ padding: 24px 20px 8px; text-align:center; }
  header h1{ font-family:'Kalam', cursive; font-size: 24px; margin:0 0 4px; }
  header p{ margin:0; font-size: 12.5px; color: var(--chalk-dim); }

  .wheel-wrap{
    position: relative;
    height: 240px;
    margin: 20px 0;
  }
  .wheel-highlight{
    position: absolute;
    top: 50%; left: 16px; right: 16px;
    height: 48px;
    transform: translateY(-50%);
    border-top: 1px solid var(--amber);
    border-bottom: 1px solid var(--amber);
    background: rgba(232,163,61,0.08);
    pointer-events: none;
    border-radius: 10px;
  }
  .wheel{
    height: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 96px 0; /* (240 - 48) / 2 上下留白，讓第一/最後一項也能滾到中間 */
  }
  .wheel::-webkit-scrollbar{ display:none; }
  .wheel-item{
    height: 48px;
    display:flex; align-items:center; justify-content:center;
    scroll-snap-align: center;
    font-size: 17px;
    color: var(--chalk-dim);
    transition: color .15s, font-size .15s;
  }
  .wheel-item.selected{
    color: var(--amber);
    font-family: 'Kalam', cursive;
    font-size: 22px;
    font-weight: 700;
  }

  .confirm-area{ padding: 0 20px; }
  .confirm-btn{
    width: 100%; border:none; border-radius: 14px; padding: 15px;
    background: var(--amber); color: #2b1d05; font-size: 16px; font-weight: 700;
  }
  .confirm-btn:active{ opacity: .85; }

  .status-screen{
    min-height: 80vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 0 24px; gap: 10px;
  }
  .status-screen .icon{ font-size: 40px; }
  .status-screen p{ color: var(--chalk-dim); font-size: 14px; margin:0; }
</style>
</head>
<body>

<div id="app">
  <div class="status-screen"><p>載入中…</p></div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  tg?.ready();
  tg?.expand();

  const params = new URLSearchParams(window.location.search);
  const chatId = params.get("chat_id");
  const app = document.getElementById("app");

  function showStatus(icon, text){
    app.innerHTML = `<div class="status-screen"><div class="icon">${icon}</div><p>${text}</p></div>`;
  }

  async function apiGet(path){
    const res = await fetch(path);
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || "request failed");
    return data;
  }

  let selectedIndex = 0;
  let restaurantNames = [];

  function renderWheel(names, initialIndex){
    app.innerHTML = `
      <header>
        <h1>選擇餐廳 🏮</h1>
        <p>上下滾動挑選這一場要點的餐廳（只有發起人選的才會生效）</p>
      </header>
      <div class="wheel-wrap">
        <div class="wheel-highlight"></div>
        <div class="wheel" id="wheel">
          ${names.map(name => `<div class="wheel-item">${name}</div>`).join("")}
        </div>
      </div>
      <div class="confirm-area">
        <button class="confirm-btn" id="confirm-btn">確認選擇</button>
      </div>
    `;

    const wheel = document.getElementById("wheel");
    const items = Array.from(wheel.querySelectorAll(".wheel-item"));
    const itemHeight = 48;

    function updateSelected(){
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closestIdx = 0;
      let closestDist = Infinity;
      items.forEach((el, idx) => {
        const itemCenter = el.offsetTop + itemHeight / 2;
        const dist = Math.abs(itemCenter - center);
        if(dist < closestDist){ closestDist = dist; closestIdx = idx; }
      });
      items.forEach((el, idx) => el.classList.toggle("selected", idx === closestIdx));
      selectedIndex = closestIdx;
    }

    let scrollTimer;
    wheel.addEventListener("scroll", () => {
      clearTimeout(scrollTimer);
      updateSelected();
      scrollTimer = setTimeout(() => {
        tg?.HapticFeedback?.selectionChanged();
      }, 80);
    });

    // 捲到初始選項
    wheel.scrollTop = items[initialIndex].offsetTop - wheel.clientHeight / 2 + itemHeight / 2;
    updateSelected();

    document.getElementById("confirm-btn").addEventListener("click", confirmSelection);
  }

  function confirmSelection(){
    const restaurant = restaurantNames[selectedIndex];
    const payload = { type: "select_restaurant", restaurant };

    if(tg && tg.sendData){
      tg.sendData(JSON.stringify(payload));
    } else {
      alert("選擇的餐廳：" + restaurant);
    }
  }

  async function init(){
    if(!chatId){
      showStatus("⚠️", "網址缺少聊天室資訊，請從 Telegram 內的按鈕開啟。");
      return;
    }

    let sessionData;
    try{
      sessionData = await apiGet(`/api/session/${chatId}`);
    } catch(e){
      showStatus("⚠️", "無法連線到伺服器，請稍後再試。");
      return;
    }

    if(!sessionData.active){
      showStatus("🔒", "目前沒有進行中的點餐。");
      return;
    }

    let restaurantData;
    try{
      restaurantData = await apiGet(`/api/restaurants`);
    } catch(e){
      showStatus("⚠️", "餐廳清單載入失敗，請稍後再試。");
      return;
    }

    restaurantNames = restaurantData.restaurants;
    if(restaurantNames.length === 0){
      showStatus("🍽️", "目前還沒有任何餐廳，請先用 /新增菜單 建立。");
      return;
    }

    const currentIdx = sessionData.restaurant
      ? Math.max(0, restaurantNames.indexOf(sessionData.restaurant))
      : 0;

    renderWheel(restaurantNames, currentIdx);
  }

  init();
</script>

</body>
</html>
